name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_CREDENTIALS_PATH: firebase-credentials-ci.json
        run: |
          echo '${{ secrets.FIREBASE_CREDENTIALS }}' > firebase-credentials-ci.json
          pip install pytest-cov
          pytest --cov=app --cov-report=xml

      - name: Show coverage file (debug)
        run: |
          echo "Workspace files:" && ls -la
          if [ -f coverage.xml ]; then echo "coverage.xml found"; else echo "coverage.xml NOT found"; fi
          echo "---- coverage.xml head ----"
          if [ -f coverage.xml ]; then head -n 200 coverage.xml || true; fi

      - name: Normalize coverage paths for Sonar
        run: |
          if [ -f coverage.xml ]; then
            echo "Normalizing coverage source paths..."
            sed -i "s|<source>.*app</source>|<source>app</source>|g" coverage.xml || true
            echo "---- coverage.xml head (normalized) ----"
            head -n 40 coverage.xml || true
          else
            echo "coverage.xml not found, skipping normalization"
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@49e6cd3b187936a73b8280d59ffd9da69df63ec9
        with:
          args: -Dsonar.tests=test -Dsonar.python.coverage.reportPaths=coverage.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
